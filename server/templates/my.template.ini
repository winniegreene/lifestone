# Lifestone portable MariaDB configuration (template).
# setup-server.ps1 renders this to server/runtime/my.ini; mariadbd is always started with
# --defaults-file=<that file> so no other option file (C:\my.ini, C:\Windows\my.ini, ...) is read.
# Placeholders: {{BASEDIR}} {{DATADIR}} {{TMPDIR}} {{FILESDIR}} {{LOGDIR}} {{HOST}} {{PORT}}

[mysqld]
basedir={{BASEDIR}}
datadir={{DATADIR}}
tmpdir={{TMPDIR}}
pid-file={{DATADIR}}/mariadbd.pid
log-error={{LOGDIR}}/mariadb.err

# Network: loopback only. Never change bind-address to 0.0.0.0 (it would also trigger a firewall prompt).
bind-address={{HOST}}
port={{PORT}}
skip-name-resolve
# No named-pipe endpoint (shared memory is off by default and not a valid option in this build).
named-pipe=OFF

# Hardening
local-infile=0
secure-file-priv={{FILESDIR}}

# Character set: ACE's base SQL creates utf8mb4 (auth/shard) and utf8mb3 (world) tables.
character-set-server=utf8mb4
collation-server=utf8mb4_general_ci
character_set_collations=utf8mb4=utf8mb4_general_ci

# Sizing for a single-player ACE (world DB is ~150 MB of SQL).
max_connections=300
max_allowed_packet=64M
innodb_buffer_pool_size=512M
innodb_log_file_size=128M

[client]
host={{HOST}}
port={{PORT}}
protocol=TCP
